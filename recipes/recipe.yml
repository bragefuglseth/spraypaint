name: spraypaint
description: Fedora with a coat of spray paint

base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 42

modules:
  - type: files
    files:
      - source: .
        destination: /

  - type: rpm-ostree
    install:
      - gnome-console
      - gnome-backgrounds-extras
      - sushi
    remove:
      - firefox
      - firefox-langpacks
      - desktop-backgrounds-gnome
      - f42-backgrounds-gnome
      - ptyxis

  - type: default-flatpaks
    system:
      # If no repo information is specified, Flathub will be used by default
      install:
        - org.gnome.baobab
        - org.gnome.Calculator
        - org.gnome.Calendar
        - org.gnome.Characters
        - org.gnome.Decibels # incubator app
        - org.gnome.Epiphany
        - org.gnome.Extensions
        - org.gnome.Showtime # incubator app
        - org.gnome.Snapshot
        - org.gnome.clocks
        - org.gnome.Connections
        - org.gnome.Contacts
        - org.gnome.Extensions
        - org.gnome.font-viewer
        - org.gnome.TextEditor
        - org.gnome.Loupe
        - org.gnome.Logs
        - org.gnome.Maps
        - org.gnome.Music
        - org.gnome.Papers # incubator app
        - org.gnome.Weather

  - type: initramfs
  - type: signing # this sets up the proper policy & signing files for signed images to work fully


name: spraypaint
description: Fedora with a coat of spray paint

base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 42

modules:
  - type: files
    files:
      - source: .
        destination: /

  - type: dnf
    install:
      - gnome-console
      - sushi
    remove:
      - firefox
      - firefox-langpacks
      - desktop-backgrounds-gnome
      - f42-backgrounds-gnome
      - ptyxis

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.gnome.baobab
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.Decibels
          - org.gnome.Epiphany
          - org.gnome.Extensions
          - org.gnome.Showtime
          - org.gnome.Snapshot
          - org.gnome.clocks
          - org.gnome.Connections
          - org.gnome.Contacts
          - org.gnome.Extensions
          - org.gnome.font-viewer
          - org.gnome.TextEditor
          - org.gnome.Loupe
          - org.gnome.Logs
          - org.gnome.Maps
          - org.gnome.Music
          - org.gnome.Papers
          - org.gnome.Weather
  - type: initramfs
  - type: signing
